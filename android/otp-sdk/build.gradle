plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext.PUBLISH_ARTIFACT_ID = "otp-sdk"
ext.POM_NAME = "OTP SDK"
ext.POM_DESCRIPTION = "OTP auto-read SDK for Android (SMS Retriever + WhatsApp zero-tap templates)."

android {
    namespace = 'com.otplesssdk.otp'
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            // Library modules should not enforce shrinking/obfuscation;
            // expose rules via consumerProguardFiles so app consumers control it.
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Utils SDK
    implementation project(':utils-sdk')

    // SMS Retriever
    // implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.2.0'
    // OTP SDK uses coroutine primitives (scope/launch/delay) but does not require Android Main dispatchers here.
    // Keep Android dispatchers in utils-sdk (SdkCoroutineScope uses Dispatchers.Main).
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: rootProject.file("publish.gradle")
