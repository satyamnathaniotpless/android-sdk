// Root build.gradle for the Android multi-module project.
//
// Centralize plugin classpaths and repositories here so module build.gradle files
// don't have to duplicate them (avoids version drift across modules).
plugins {
    id "com.android.application" version "8.13.2" apply false
    id "com.android.library" version "8.13.2" apply false
    id "org.jetbrains.kotlin.android" version "2.3.0" apply false
    id "org.jetbrains.kotlin.jvm" version "2.3.0" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

