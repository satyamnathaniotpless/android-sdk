plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

ext.PUBLISH_ARTIFACT_ID = "sna-sdk"
ext.POM_NAME = "SNA SDK"
ext.POM_DESCRIPTION = "SIM Network Authentication (SNA) SDK for Android (cellular-enforced SNA calls + SIM/network info)."

android {
    namespace = 'com.otplesssdk.sna'
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            // Library modules should not minify themselves; consumers control shrinking.
            minifyEnabled = false
        }
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Utils SDK
    implementation project(':utils-sdk')

    // Minimal dependencies for lightweight SDK
    // Kotlin Coroutines for async operations
    // Note: sna-sdk uses coroutines but does not require Android Main dispatchers.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // OkHttp for network calls (redirect following + event tracing)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: rootProject.file("publish.gradle")
